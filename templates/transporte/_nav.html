{% with atual=request.resolver_match.url_name %}
<nav class="flex flex-wrap gap-2 mb-6 no-print">
    <a href="{% url 'transporte:transporte_home' %}" class="btn btn-sm {% if atual == 'transporte_home' %}bg-indigo-600 text-white{% else %}bg-white border border-gray-200 text-gray-700 hover:bg-gray-50{% endif %}"><i class="fas fa-bus-alt"></i> Início</a>
    <a href="{% url 'transporte:rota_list' %}" class="btn btn-sm {% if 'rota' in atual or 'ponto' in atual %}bg-indigo-600 text-white{% else %}bg-white border border-gray-200 text-gray-700 hover:bg-gray-50{% endif %}"><i class="fas fa-route"></i> Rotas</a>
    <a href="{% url 'transporte:veiculo_list' %}" class="btn btn-sm {% if 'veiculo' in atual %}bg-indigo-600 text-white{% else %}bg-white border border-gray-200 text-gray-700 hover:bg-gray-50{% endif %}"><i class="fas fa-bus"></i> Veículos</a>
    <a href="{% url 'transporte:motorista_list' %}" class="btn btn-sm {% if 'motorista' in atual %}bg-indigo-600 text-white{% else %}bg-white border border-gray-200 text-gray-700 hover:bg-gray-50{% endif %}"><i class="fas fa-id-card"></i> Motoristas</a>
    <a href="{% url 'transporte:aluno_transporte_list' %}" class="btn btn-sm {% if 'aluno_transporte' in atual %}bg-indigo-600 text-white{% else %}bg-white border border-gray-200 text-gray-700 hover:bg-gray-50{% endif %}"><i class="fas fa-user-graduate"></i> Alunos</a>
    <a href="{% url 'transporte:relatorio_transporte' %}" class="btn btn-sm {% if atual == 'relatorio_transporte' %}bg-indigo-600 text-white{% else %}bg-white border border-gray-200 text-gray-700 hover:bg-gray-50{% endif %}"><i class="fas fa-chart-bar"></i> Relatório</a>
</nav>
{% endwith %}
