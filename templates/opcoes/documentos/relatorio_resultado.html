{% extends 'base.html' %}

{% block title %}{{ title }} - GUTO{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
        <div class="flex items-center gap-4">
            <a href="{% url 'opcoes:selecionar_relatorio' tipo_relatorio.pk %}" class="p-2 rounded-lg text-gray-500 hover:text-indigo-600 hover:bg-indigo-50" title="Voltar aos filtros"><i class="fas fa-arrow-left"></i></a>
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-900">{{ tipo_relatorio }}</h1>
                <p class="text-gray-600">Gerado em {{ data_geracao|date:"d/m/Y H:i" }}</p>
            </div>
        </div>
        <div class="flex gap-3">
            <a href="{% url 'opcoes:documentos_home' %}" class="btn-secondary"><i class="fas fa-file-alt"></i> Outros relatórios</a>
            <a href="?format=print" target="_blank" class="btn-primary"><i class="fas fa-print"></i> Imprimir</a>
        </div>
    </div>
    <div class="card card-body">
        {% include 'opcoes/documentos/_relatorio_conteudo.html' %}
    </div>
</div>
{% endblock %}
